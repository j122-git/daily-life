<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f806a"
  >

  <meta
    name="description"
    content="Daily Life — good food, happy home."
  >

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <!-- App icons -->
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icons/icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./icons/icon-512.png"
  >

  <!-- Android / mobile -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <!-- iOS -->
  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.png"
  >

  <title>Daily Life</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <div id="app"></div>

  <script src="./app.js"></script>

</body>
</html>
